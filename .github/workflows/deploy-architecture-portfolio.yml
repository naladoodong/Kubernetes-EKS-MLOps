name: Deploy architecture portfolio

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "docs/architecture/ArgMax_Mini_System_Architecture_and_Design_final.pdf"
      - "docs/portfolio/ArgMax_Mini_AWS_EKS_Architecture_Case_Study.pdf"
      - "docs/diagrams/**"
      - ".github/workflows/deploy-architecture-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "architecture-portfolio-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static portfolio
        working-directory: portfolio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
