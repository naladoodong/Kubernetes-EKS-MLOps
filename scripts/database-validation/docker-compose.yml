services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argmax}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argmax} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - argmax-db-validation:/var/lib/postgresql/data

volumes:
  argmax-db-validation:
